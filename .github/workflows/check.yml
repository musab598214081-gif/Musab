name: Check the app
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The page's script and sw.js must parse
        run: |
          python3 -c "import re;s=open('index.html',encoding='utf-8').read();open('app.js','w',encoding='utf-8').write(re.findall(r'<script>(.*?)</script>',s,re.S)[-1])"
          node --check app.js
          node --check sw.js
